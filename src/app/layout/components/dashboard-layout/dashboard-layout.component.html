<div class="dashboard-container">
  <app-skip-link></app-skip-link>
  <app-offline-indicator></app-offline-indicator>

  <app-sidebar
    [isCollapsed]="isSidebarCollapsed()"
    [isMobileOpen]="isMobileMenuOpen()"
    (collapsedChange)="onSidebarToggle($event)"
    (menuClicked)="closeMobileMenu()"
  >
  </app-sidebar>

  @if (isMobileMenuOpen()) {
    <div class="mobile-overlay" (click)="closeMobileMenu()"></div>
  }

  <div class="main-wrapper" [class.sidebar-collapsed]="isSidebarCollapsed()">
    <app-header [pageTitle]="pageTitle()" (toggleSidebar)="onMobileMenuToggle()"> </app-header>

    <main class="main-content" id="main-content" tabindex="-1">
      <router-outlet></router-outlet>
    </main>
  </div>

  <app-toaster></app-toaster>
  <app-modal></app-modal>
  <app-command-palette></app-command-palette>
</div>
