<header class="header">
  <div class="header-left">
    <button class="btn-toggle-sidebar" (click)="onToggleSidebar()">
      <i class="fas fa-bars"></i>
    </button>
    <div class="page-title">
      <h1>{{ pageTitle }}</h1>
      <span class="breadcrumb">HRM System</span>
    </div>
  </div>

  <div class="header-right">
    <div class="header-date">
      <i class="fas fa-calendar-alt"></i>
      <span>{{ formattedDate }}</span>
    </div>

    <button
      class="btn-icon command-trigger"
      title="Search & Commands (Ctrl+K)"
      (click)="openCommandPalette()"
    >
      <i class="fas fa-search"></i>
      <kbd class="shortcut-badge">Ctrl+K</kbd>
    </button>

    <app-notification-center
      (notificationClick)="onNotificationClick($event)"
      (viewAllClick)="onViewAllNotifications()"
    ></app-notification-center>

    <app-theme-toggle></app-theme-toggle>
    <app-accessibility-menu></app-accessibility-menu>

    <button class="btn-icon" title="Help">
      <i class="fas fa-question-circle"></i>
    </button>
  </div>
</header>
